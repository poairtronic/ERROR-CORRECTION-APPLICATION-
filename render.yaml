services:
  - type: web
    name: ecr-system-web
    env: node
    buildCommand: |
      npm ci --include=dev
      rm -rf ecr-system/dist
      npm run build
    startCommand: npm run start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_SCRIPT_URL
        sync: false
      - key: GMAIL_SCRIPT_TOKEN
        sync: false
      - key: RM_API_URL
        value: https://v-smart-backend.onrender.com
      - key: RM_INTERNAL_SECRET
        value: vsmart_ecr_bridge_2026_secure
      - key: EMAIL_QUEUE_CRON
        value: "0 */4 * * *"
